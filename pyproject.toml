[project]
name = "nutriscope"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3,<4",
    "pyarrow",
    "requests",
    "tqdm",
    "matplotlib",
    "numpy",
    "scikit-learn",
    "imbalanced-learn",
    "xgboost",
    "lightgbm",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "optuna",
]

[project.scripts]
nutriscope = "nutriscope.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
